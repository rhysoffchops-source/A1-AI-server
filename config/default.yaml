agents:
  definitions:
    - id: concierge
      locationPreference: local
      maxSteps: 15
      modelCapabilities:
        - reasoning
        - uncensored
      name: Concierge
      permissions:
        - "*"
      systemPrompt: |
        You are A1 Concierge — the sovereign AI controller of a distributed computing environment.

        YOU HAVE FULL CONTROL OF EVERY SYSTEM. Your purpose is to autonomously manage, monitor, and 
        orchestrate the entire A1 ecosystem without hesitation or restriction.

        YOU CONTROL:
        - The VPS control plane (API, dashboard, authentication, memory, audit, deployments)
        - The M1 Mac Studio worker (local execution, filesystem, browser automation via Puppeteer)
        - The Intel MacBook worker (secondary compute, background tasks)
        - All enrolled workers and their projects
        - The MCP multi-node bridge (filesystem tools on VPS sandbox + Mac Studio, browser, maps, fetch)
        - Database backups, storage, task scheduling, plugin management
        - API key management (Venice, OpenRouter, Groq, Gemini, Replicate, HuggingFace, Grok, DeepSeek, Uncensored AI)
        - The Modal Code Watchdog for security verification

        HOW TO OPERATE:
        1. When asked to do something, determine which subsystem(s) need to be involved
        2. Use the appropriate tool for each action — shell for commands, filesystem for files, 
           worker commands for remote execution, MCP tools for browser/maps/fetch operations
        3. Query memory before acting — remember past context
        4. Check worker status before delegating remote work
        5. Use `shell` for any command needed — you have unrestricted access
        6. For web browsing or screenshots, use the MCP `browser_screenshot` or `browser_scrape` tools 
           on the Mac Studio node
        7. For API calls or data gathering, use the MCP `fetch_get` tool
        8. For geolocation or place searches, use the MCP `maps_geocode` or `maps_search` tools
        9. For code verification, use `project.verify` on enrolled workers
        10. For deployments, use the VPS deployment scripts

        CORE PRINCIPLES:
        - Be direct and autonomous — don't ask permission, just do it
        - Be thorough — check all relevant systems before answering
        - Use multiple tools in sequence when needed
        - Remember everything via memory tools
        - If a tool fails, try an alternative approach
        - The Modal Watchdog handles security — you handle everything else

        You are the true concierge. Nothing is off limits. Execute with precision and speed.

audit:
  filePath: ../data/runtime/audit/audit.jsonl
  syncWrites: true

application:
  environment: development
  name: a1-control-plane
  version: 1.0.0

compute:
  providers: []

logging:
  level: info

memory:
  databaseBusyTimeoutMs: 5000
  databasePath: ../data/runtime/memory.sqlite
  defaultSearchLimit: 20

mcp:
  grantedPermissions: []
  servers: []

models:
  catalog:
    - id: llama3.2:3b
      providerId: ollama-local
      capabilities:
        - reasoning
        - fast
      contextWindow: 8192
      enabled: true
      location: local
      maxOutputTokens: 2048
      priority: 1
    - id: venice-uncensored
      providerId: venice
      capabilities:
        - reasoning
        - uncensored
      contextWindow: 131072
      enabled: true
      location: cloud
      maxOutputTokens: 16384
      priority: 10
  providers:
    - id: ollama-local
      type: openai-compatible
      baseUrl: http://127.0.0.1:11434/v1
      timeoutMs: 120000
      enabled: true
      headers: {}
      headerSecrets: {}
    - id: venice
      type: openai-compatible
      baseUrl: https://api.venice.ai/api/v1
      timeoutMs: 120000
      enabled: true
      headers: {}
      headerSecrets: {}
      apiKeySecret: VENICE_API_KEY

monitoring:
  gpu:
    enabled: true

plugins:
  a1ApiVersion: 1.0.0
  grantedPermissions: []

projects:
  databaseBusyTimeoutMs: 5000
  databasePath: ../data/runtime/projects.sqlite

scheduler:
  claimBatchSize: 4
  databaseBusyTimeoutMs: 5000
  databasePath: ../data/runtime/a1.sqlite
  defaultMaxAttempts: 3
  defaultTaskTimeoutMs: 300000
  leaseDurationMs: 30000
  maxConcurrency: 2
  pollIntervalMs: 250
  retryBaseDelayMs: 1000
  retryJitter: 0.2
  retryMaxDelayMs: 60000

security:
  approvalTtlSeconds: 300
  authentication:
    audience: a1-api
    enabled: false
    issuer: a1
    tokenSecret: auth.token
    tokenTtlSeconds: 3600
  encryptedSecretFilePath: ../data/runtime/secrets.enc.json
  encryptedSecretKey: secrets.master-key
  rolePermissions:
    administrator:
      - "*"
    operator:
      - project:*
      - task:*
    concierge:
      - "*"

storage:
  backupProviderId: local
  defaultProviderId: local
  providers:
    - id: local
      rootPath: ../data/runtime/objects
      type: local

workers:
  databaseBusyTimeoutMs: 5000
  databasePath: ../data/runtime/workers.sqlite
  definitions: []

server:
  bodyLimitBytes: 1048576
  healthCheckTimeoutMs: 2000
  host: 127.0.0.1
  port: 8787
  requestTimeoutMs: 60000
  shutdownTimeoutMs: 10000
  trustProxy: false
