<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#090d14" />
    <title>A1 Control Plane</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand"><span class="brand-mark">A1</span><span>Control Plane</span></div>
        <nav id="nav" aria-label="Primary navigation"></nav>
        <div class="connection">
          <i id="connection-dot"></i><span id="connection-text">Connecting</span>
        </div>
      </aside>
      <main>
        <header>
          <div>
            <p class="eyebrow">AUTONOMOUS SYSTEM</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <div class="header-actions">
            <span id="clock"></span><button id="access" type="button">Access token</button
            ><button id="refresh" type="button">Refresh</button>
          </div>
        </header>
        <section id="content" aria-live="polite"><div class="loading">Loading A1…</div></section>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
